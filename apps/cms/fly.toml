# Directus en Fly.io (org daniela-zarraga) con SQLite sobre un volumen. Se despliega con `pnpm release`.
# Primer despliegue (una sola vez):
#   fly apps create korokotico-cms-prod --org daniela-zarraga
#   fly volumes create cms_data --app korokotico-cms-prod --region dfw --size 1
#   fly secrets set --app korokotico-cms-prod SECRET=... ADMIN_EMAIL=... ADMIN_PASSWORD=...
# Correos (recuperar contraseña) por Resend: fly secrets set --app korokotico-cms-prod EMAIL_SMTP_PASSWORD=re_...
app = "korokotico-cms-prod"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_URL = "https://admin.korokotico.com"
  DEFAULT_LANGUAGE = "es-ES"
  CORS_ENABLED = "true"
  CORS_ORIGIN = "true"
  # SQLite no admite varias instancias escribiendo a la vez
  PM2_INSTANCES = "1"
  CACHE_ENABLED = "false"
  WEBSOCKETS_ENABLED = "false"
  TELEMETRY = "false"
  FILES_MAX_UPLOAD_SIZE = "20mb"
  # Correos del panel (recuperar contraseña, invitaciones) por el SMTP de Resend.
  # La clave va como secreto: EMAIL_SMTP_PASSWORD = la API key de Resend. El dominio debe estar verificado en Resend.
  # Solo la dirección: Directus le pone el nombre del proyecto (Korokotico)
  EMAIL_FROM = "no-responder@korokotico.com"
  EMAIL_TRANSPORT = "smtp"
  EMAIL_SMTP_HOST = "smtp.resend.com"
  EMAIL_SMTP_PORT = "465"
  EMAIL_SMTP_SECURE = "true"
  EMAIL_SMTP_USER = "resend"

[mounts]
  source = "cms_data"
  destination = "/directus/data"

[http_service]
  internal_port = 8055
  force_https = true
  # La máquina se apaga sola cuando no hay tráfico: casi no cuesta nada
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/server/ping"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
