# Destino «cliente»: org de Fly daniela-zarraga. Se despliega con `pnpm release:cliente`.
# Primer despliegue (una sola vez):
#   fly apps create korokotico-web-prod --org daniela-zarraga
#   fly secrets set --app korokotico-web-prod DIRECTUS_TOKEN=... SESSION_SECRET=...
app = "korokotico-web-prod"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  DIRECTUS_URL = "https://korokotico-cms-prod.fly.dev"
  SITE_URL = "https://korokotico-web-prod.fly.dev"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Se apaga cuando no hay visitas y arranca sola en la siguiente
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
