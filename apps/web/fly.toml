# Web de Korokotico en Fly.io (org daniela-zarraga). Se despliega con `pnpm release`.
# Primer despliegue (una sola vez):
#   fly apps create korokotico-web-prod --org daniela-zarraga
#   fly secrets set --app korokotico-web-prod DIRECTUS_TOKEN=... SESSION_SECRET=...
# Aviso de pedidos por Resend: fly secrets set --app korokotico-web-prod RESEND_API_KEY=re_...
app = "korokotico-web-prod"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  DIRECTUS_URL = "https://admin.korokotico.com"
  SITE_URL = "https://korokotico.com"
  PORT = "3000"
  # Remitente de los avisos de pedidos (el dominio debe estar verificado en Resend)
  ORDER_EMAIL_FROM = "Korokotico <pedidos@korokotico.com>"

[http_service]
  internal_port = 3000
  force_https = true
  # Se apaga cuando no hay visitas y arranca sola en la siguiente
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
